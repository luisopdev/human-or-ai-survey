<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Human or AI? – Music Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  :root, [data-theme="dark"] {
    --bg: #0E1016; --card: #171A23; --border: #2C3140; --track: #2C3140;
    --text: #F2F3F7; --muted: #A3A9B8; --accent: #8B9BFF; --on-accent: #0E1016;
    --sel: #1E2340; --idle: #3A4052; --disabled: #262A36; --disabled-text: #7A8090;
  }
  [data-theme="light"] {
    --bg: #F3F4F7; --card: #FFFFFF; --border: #D9DCE4; --track: #DDE0E8;
    --text: #14161F; --muted: #4A5060; --accent: #2337C6; --on-accent: #FFFFFF;
    --sel: #EEF0FF; --idle: #8A90A0; --disabled: #D3D6DE; --disabled-text: #555B69;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.5; min-height: 100vh; min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
  }
  .display { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid #F2A541; outline-offset: 2px; }

  .app { width: 100%; max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
         padding: 16px 16px max(24px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 20px; }
  .topbar { display: flex; justify-content: flex-end; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border);
              background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .progress { display: flex; flex-direction: column; gap: 8px; }
  .progress-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; color: var(--muted); }
  .track { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .3s ease; }

  .screen { flex: 1; display: flex; flex-direction: column; gap: 24px; }
  .screen.enter { animation: slideIn .32s ease-out both; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen.enter { animation: none; } .wave.playing span { animation: none !important; } }
  .spacer { flex: 1; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
         border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 56px; }
  .bars span { display: block; width: 8px; border-radius: 4px; background: var(--accent); }
  .bars span:nth-child(3n+2) { background: var(--text); }
  .bars span:nth-child(3n) { opacity: .55; }
  h1 { margin: 0; font-size: clamp(34px, 9vw, 48px); line-height: 1.05; letter-spacing: -.02em; }
  h1 .accent { color: var(--accent); }
  h2 { margin: 0; font-size: clamp(22px, 6vw, 26px); line-height: 1.2; }
  h2.big { font-size: clamp(24px, 6.5vw, 30px); line-height: 1.15; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .lead { font-size: 17px; color: var(--muted); }
  .small { font-size: 13px; }
  .center { text-align: center; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
  .facts { display: flex; flex-direction: column; gap: 14px; }
  .fact { display: flex; gap: 12px; align-items: center; }
  .fact svg { flex: none; color: var(--accent); }

  .group { display: flex; flex-direction: column; gap: 14px; }
  .q-head { display: flex; flex-direction: column; gap: 4px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: left; padding: 16px 18px;
            border-radius: 14px; border: 2px solid var(--border); background: var(--card); cursor: pointer; min-height: 44px; }
  .option[aria-checked="true"] { border-color: var(--accent); background: var(--sel); }
  .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; margin-top: 3px; border: 2px solid var(--idle); }
  .option[aria-checked="true"] .dot { border: 6px solid var(--accent); }
  .opt-title { display: block; font-weight: 600; font-size: 17px; }
  .opt-desc { display: block; font-size: 15px; color: var(--muted); }

  .btn { width: 100%; min-height: 56px; border-radius: 14px; border: none; cursor: pointer;
         font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 18px;
         background: var(--accent); color: var(--on-accent); }
  .btn:disabled { background: var(--disabled); color: var(--disabled-text); cursor: not-allowed; }
  .btn-outline { min-height: 52px; padding: 0 24px; border-radius: 14px; border: 2px solid var(--border);
                 background: transparent; font-weight: 600; cursor: pointer; }
  .nav { display: flex; gap: 10px; }
  .back { flex: none; width: 56px; min-height: 56px; border-radius: 14px; border: 2px solid var(--border);
          background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  .player { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 20px;
            display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .wave { display: flex; align-items: center; gap: 5px; height: 48px; }
  .wave span { display: block; width: 5px; border-radius: 3px; background: var(--idle); transform-origin: center; }
  .wave.playing span { background: var(--accent); animation: pulse .9s ease-in-out infinite; }
  .wave.playing span:nth-child(5n+1) { animation-duration: .6s; }
  .wave.playing span:nth-child(5n+2) { animation-duration: .75s; }
  .wave.playing span:nth-child(5n+3) { animation-duration: 1.05s; }
  .wave.playing span:nth-child(5n+4) { animation-duration: 1.2s; }
  @keyframes pulse { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  .play { width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer; display: flex;
          align-items: center; justify-content: center; background: var(--accent); color: var(--on-accent); }
  .time { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .time-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice { width: 100%; min-height: 60px; border-radius: 14px; font-weight: 600; font-size: 17px; cursor: pointer;
            border: 2px solid var(--border); background: var(--card); }
  .choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
  .choice:disabled { border-style: dashed; background: transparent; color: var(--disabled-text); cursor: not-allowed; }
  .pills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pill { min-height: 44px; padding: 0 8px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer;
          border: 2px solid var(--border); background: transparent; }
  .pill[aria-checked="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }

  .done { justify-content: center; align-items: center; text-align: center; gap: 18px; padding: 40px 0; }
  .check { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
           display: flex; align-items: center; justify-content: center; }
  .error { color: #FF8A80; font-size: 14px; }
  [data-theme="light"] .error { color: #B3261E; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to light theme"></button>
  </div>
  <div id="progress"></div>
  <div id="screen" class="screen"></div>
  <audio id="audio" preload="auto"></audio>
</main>

<script>
/* =====================================================================
   SETTINGS — edit these.
   ===================================================================== */
const CONFIG = {
  // Where answers are sent (POST, JSON). Leave empty for demo mode:
  // nothing is saved and the clips are simulated.
  submitUrl: '',

  // Shuffle the clip order for every participant.
  shuffleClips: true,

  // The clips. "src" = path or URL to the audio file (MP3 recommended).
  // Leave src empty to simulate playback in the demo.
  // The correct answer is NOT stored here — keep it in the database.
  clips: [
    { id: 'C1', src: '', duration: 20 },
    { id: 'C2', src: '', duration: 20 },
    { id: 'C3', src: '', duration: 20 },
    { id: 'C4', src: '', duration: 20 },
    { id: 'C5', src: '', duration: 20 },
  ],
};

/* =====================================================================
   SCREEN TEXT — numbers match the "Survey Screen Text" doc.
   ===================================================================== */
const TEXT = {
  '1.1': ['AP Research', 'Grade 11', 'Doral Academy'],
  '1.2': 'Human or AI?',
  '1.3': 'Can you hear the difference?',
  '1.4': 'This survey is part of an AP Research project on whether listeners can tell AI-generated music apart from music made by people.',
  '1.5': 'Takes about 5 minutes',
  '1.6': 'You’ll listen to 5 short music clips',
  '1.7': 'Your answers are anonymous',
  '1.8': 'Start the survey',
  '1.9': 'By tapping Start, you agree to take part. Researcher: [NAME]',

  '2.1': 'About you',
  '2.2': 'How would you describe your music knowledge?',
  '2.3': ['Basic', 'I listen to music, but I haven’t studied it or played an instrument.'],
  '2.4': ['Intermediate', 'I play an instrument or sing, or I’ve taken some music classes.'],
  '2.5': ['Advanced', 'I have years of formal training, or I perform, compose or produce music.'],
  '2.6': 'How are you listening?',
  '2.7': 'Please use the same setup for every clip.',
  '2.8': ['Headphones or earbuds', 'Any wired or wireless headphones or earbuds.'],
  '2.9': ['Speaker, quiet place', 'Phone, laptop or other speaker with little background noise.'],
  '2.10': ['Speaker, noisy place', 'Phone, laptop or other speaker with noticeable background noise.'],
  '2.11': ['Back', 'Next'],

  '3.1': 'Clip {n} of {total}',
  '3.2': 'Was this made by a human or by AI?',
  '3.3': 'Listen first. You can replay the clip as many times as you like.',
  '3.4': 'Made by a human',
  '3.5': 'Generated by AI',
  '3.6': 'Play the clip to unlock your answer.',
  '3.7': ['How sure are you?', '(optional)'],
  '3.8': ['Guessing', 'Fairly sure', 'Very sure'],
  '3.9': 'Next clip',
  '3.10': 'Submit my answers',

  '8.1': 'Thanks for taking part!',
  '8.2': 'Your answers have been recorded. Please don’t tell friends which clips you think are AI until they’ve taken the survey too.',
  '8.3': 'Start a new response',

  step: 'Step {n} of {total}',
  sending: 'Sending…',
  sendError: 'Your answers couldn’t be sent. Check your connection and try again.',
};

/* =====================================================================
   App
   ===================================================================== */
const LEVELS = [['basic', '2.3'], ['intermediate', '2.4'], ['advanced', '2.5']];
const SETUPS = [['headphones', '2.8'], ['speaker_quiet', '2.9'], ['speaker_noisy', '2.10']];
const CONFS = ['guessing', 'fairly_sure', 'very_sure'];
const WAVE = [30,55,80,45,95,65,40,85,100,60,35,75,90,50,70,100,45,80,60,30,65,90,40,55];
const BARS = [40,70,100,55,85,30,65,95,45,75,50,90];

const ICON = {
  play: '<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="8,4 20,12 8,20"/></svg>',
  pause: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15,6 9,12 15,18"/></svg>',
  check: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5,12.5 10,17.5 19,7"/></svg>',
  clock: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12,7 12,12 15,14"/></svg>',
  note: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  lock: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  sun: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'r-' + Date.now() + '-' + Math.random().toString(16).slice(2));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const N = CONFIG.clips.length;
const LAST = N + 1;            // last question step
const DONE = N + 2;            // thank-you step
const audio = document.getElementById('audio');
const $screen = document.getElementById('screen');
const $progress = document.getElementById('progress');

let S, lastStep = -1, sim = null;

function newState() {
  return {
    id: uuid(), startedAt: new Date().toISOString(), step: 0,
    level: null, setup: null,
    order: CONFIG.shuffleClips ? shuffle(CONFIG.clips) : CONFIG.clips.slice(),
    answers: {}, conf: {}, plays: {}, played: {},
    playing: false, pos: 0, sending: false, error: false,
  };
}

const currentClip = () => S.order[S.step - 2];

function ready() {
  if (S.step === 1) return !!(S.level && S.setup);
  if (S.step >= 2 && S.step <= LAST) return !!S.answers[currentClip().id];
  return true;
}

/* ---------- playback (real audio, or simulated when src is empty) ---------- */
function stopAudio() {
  audio.pause();
  if (sim) { clearInterval(sim); sim = null; }
  S.playing = false;
}
function togglePlay() {
  const clip = currentClip();
  if (S.playing) { stopAudio(); render(); return; }
  if (S.pos >= clip.duration - 0.05) S.pos = 0;
  S.playing = true;
  S.played[clip.id] = true;
  S.plays[clip.id] = (S.plays[clip.id] || 0) + 1;
  if (clip.src) {
    if (!audio.src.endsWith(clip.src)) audio.src = clip.src;
    audio.currentTime = S.pos;
    audio.play().catch(() => { S.playing = false; render(); });
  } else {
    sim = setInterval(() => {
      S.pos = Math.min(clip.duration, S.pos + 0.2);
      if (S.pos >= clip.duration) { stopAudio(); render(); } else tick();
    }, 200);
  }
  render();
}
audio.addEventListener('loadedmetadata', () => { const c = currentClip(); if (c && isFinite(audio.duration)) c.duration = audio.duration; tick(); });
audio.addEventListener('timeupdate', () => { S.pos = audio.currentTime; tick(); });
audio.addEventListener('ended', () => { S.playing = false; S.pos = currentClip().duration; render(); });

function tick() {
  const clip = currentClip(); if (!clip) return;
  const bar = document.getElementById('clipFill'), t = document.getElementById('clipTime');
  if (bar) bar.style.width = (S.pos / clip.duration * 100) + '%';
  if (t) t.textContent = mmss(S.pos);
}

/* ---------- actions ---------- */
function go(step) {
  stopAudio(); S.pos = 0; S.step = step; S.error = false;
  render(); window.scrollTo(0, 0);
}
async function submit() {
  stopAudio();
  const payload = {
    responseId: S.id,
    startedAt: S.startedAt,
    submittedAt: new Date().toISOString(),
    musicLevel: S.level,
    listeningSetup: S.setup,
    clips: S.order.map((c, i) => ({
      clipId: c.id, position: i + 1,
      answer: S.answers[c.id], confidence: S.conf[c.id] || null, plays: S.plays[c.id] || 0,
    })),
  };
  if (!CONFIG.submitUrl) { console.log('Demo mode — response not saved:', payload); go(DONE); return; }
  S.sending = true; S.error = false; render();
  try {
    const r = await fetch(CONFIG.submitUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error(r.status);
    S.sending = false; go(DONE);
  } catch (e) {
    S.sending = false; S.error = true; render();
  }
}

/* ---------- rendering ---------- */
function optionList(name, items, selected) {
  return items.map(([val, key]) => `
    <button type="button" class="option" role="radio" aria-checked="${selected === val}" data-${name}="${val}">
      <span class="dot"></span>
      <span><span class="opt-title">${esc(TEXT[key][0])}</span><span class="opt-desc">${esc(TEXT[key][1])}</span></span>
    </button>`).join('');
}

function render() {
  const step = S.step;

  // progress bar (question steps only)
  if (step >= 1 && step <= LAST) {
    const label = step === 1 ? TEXT['2.1'] : fmt(TEXT['3.1'], { n: step - 1, total: N });
    $progress.innerHTML = `<div class="progress"><div class="progress-row"><span>${esc(label)}</span><span>${esc(fmt(TEXT.step, { n: step, total: LAST }))}</span></div>
      <div class="track"><div class="fill" style="width:${Math.round(step / DONE * 100)}%"></div></div></div>`;
  } else $progress.innerHTML = '';

  let html = '';
  if (step === 0) {
    html = `
      <div class="tags">${TEXT['1.1'].map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="bars" aria-hidden="true">${BARS.map(h => `<span style="height:${h}%"></span>`).join('')}</div>
      <h1 class="display">${esc(TEXT['1.2'])}<br><span class="accent">${esc(TEXT['1.3'])}</span></h1>
      <p class="lead">${esc(TEXT['1.4'])}</p>
      <div class="card facts">
        <div class="fact">${ICON.clock}<span>${esc(TEXT['1.5'])}</span></div>
        <div class="fact">${ICON.note}<span>${esc(TEXT['1.6'])}</span></div>
        <div class="fact">${ICON.lock}<span>${esc(TEXT['1.7'])}</span></div>
      </div>
      <div class="spacer"></div>
      <div class="group" style="gap:10px">
        <button type="button" class="btn" data-action="start">${esc(TEXT['1.8'])}</button>
        <p class="small muted center">${esc(TEXT['1.9'])}</p>
      </div>`;
  } else if (step === 1) {
    html = `
      <div class="group">
        <h2 class="display" id="qLevel">${esc(TEXT['2.2'])}</h2>
        <div class="options" role="radiogroup" aria-labelledby="qLevel">${optionList('level', LEVELS, S.level)}</div>
      </div>
      <div class="group">
        <div class="q-head"><h2 class="display" id="qSetup">${esc(TEXT['2.6'])}</h2><p class="muted">${esc(TEXT['2.7'])}</p></div>
        <div class="options" role="radiogroup" aria-labelledby="qSetup">${optionList('setup', SETUPS, S.setup)}</div>
      </div>
      <div class="spacer"></div>
      <div class="nav">
        <button type="button" class="back" data-action="back" aria-label="${esc(TEXT['2.11'][0])}">${ICON.back}</button>
        <button type="button" class="btn" data-action="next" ${ready() ? '' : 'disabled'}>${esc(TEXT['2.11'][1])}</button>
      </div>`;
  } else if (step <= LAST) {
    const clip = currentClip(), ans = S.answers[clip.id], locked = !S.played[clip.id];
    const isLast = step === LAST;
    html = `
      <div class="q-head" style="gap:6px"><h2 class="display big">${esc(TEXT['3.2'])}</h2><p class="muted">${esc(TEXT['3.3'])}</p></div>
      <div class="player">
        <div class="wave ${S.playing ? 'playing' : ''}" aria-hidden="true">${WAVE.map(h => `<span style="height:${h}%"></span>`).join('')}</div>
        <button type="button" class="play" data-action="play" aria-label="${S.playing ? 'Pause' : 'Play'} clip">${S.playing ? ICON.pause : ICON.play}</button>
        <div class="time">
          <div class="track"><div class="fill" id="clipFill" style="width:${S.pos / clip.duration * 100}%; transition:none"></div></div>
          <div class="time-row"><span id="clipTime">${mmss(S.pos)}</span><span>${mmss(clip.duration)}</span></div>
        </div>
      </div>
      <div class="choices" role="radiogroup" aria-label="${esc(TEXT['3.2'])}">
        <button type="button" class="choice" role="radio" aria-checked="${ans === 'human'}" data-answer="human" ${locked ? 'disabled' : ''}>${esc(TEXT['3.4'])}</button>
        <button type="button" class="choice" role="radio" aria-checked="${ans === 'ai'}" data-answer="ai" ${locked ? 'disabled' : ''}>${esc(TEXT['3.5'])}</button>
        ${locked ? `<p class="center muted" style="font-size:14px">${esc(TEXT['3.6'])}</p>` : ''}
      </div>
      ${ans ? `
      <div class="group" style="gap:10px">
        <span id="qConf" style="font-size:15px;font-weight:500">${esc(TEXT['3.7'][0])} <span class="muted" style="font-weight:400">${esc(TEXT['3.7'][1])}</span></span>
        <div class="pills" role="radiogroup" aria-labelledby="qConf">
          ${CONFS.map((c, i) => `<button type="button" class="pill" role="radio" aria-checked="${S.conf[clip.id] === c}" data-conf="${c}">${esc(TEXT['3.8'][i])}</button>`).join('')}
        </div>
      </div>` : ''}
      <div class="spacer"></div>
      ${S.error ? `<p class="error center" role="alert">${esc(TEXT.sendError)}</p>` : ''}
      <button type="button" class="btn" data-action="${isLast ? 'submit' : 'next'}" ${ready() && !S.sending ? '' : 'disabled'}>
        ${esc(S.sending ? TEXT.sending : isLast ? TEXT['3.10'] : TEXT['3.9'])}</button>`;
  } else {
    html = `
      <div class="screen done" style="flex:1">
        <div class="check">${ICON.check}</div>
        <h2 class="display" style="font-size:34px;line-height:1.1">${esc(TEXT['8.1'])}</h2>
        <p class="muted" style="max-width:420px;font-size:17px">${esc(TEXT['8.2'])}</p>
        <button type="button" class="btn-outline" data-action="reset" style="margin-top:8px">${esc(TEXT['8.3'])}</button>
      </div>`;
  }

  $screen.innerHTML = html;
  if (step !== lastStep) { $screen.classList.remove('enter'); void $screen.offsetWidth; $screen.classList.add('enter'); lastStep = step; }
}

/* ---------- events ---------- */
$screen.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.level) { S.level = d.level; render(); }
  else if (d.setup) { S.setup = d.setup; render(); }
  else if (d.answer) { S.answers[currentClip().id] = d.answer; render(); }
  else if (d.conf) { S.conf[currentClip().id] = d.conf; render(); }
  else if (d.action === 'start') go(1);
  else if (d.action === 'back') go(0);
  else if (d.action === 'next' && ready()) go(S.step + 1);
  else if (d.action === 'play') togglePlay();
  else if (d.action === 'submit' && ready()) submit();
  else if (d.action === 'reset') { S = newState(); go(0); }
});

/* ---------- theme (dark by default; remembered on this device) ---------- */
const themeBtn = document.getElementById('themeBtn');
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
  themeBtn.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  try { localStorage.setItem('survey-theme', t); } catch (e) {}
}
themeBtn.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
let saved = null; try { saved = localStorage.getItem('survey-theme'); } catch (e) {}
setTheme(saved === 'light' ? 'light' : 'dark');

S = newState();
render();
</script>
</body>
</html>
